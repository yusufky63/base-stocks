name: Monitor

# Uptime and alerting without a third party: every half hour, ask the deployment how it is and
# fail the run — which emails the repository's owner — when it is not well. `/api/health`
# decides what "not well" means (storage missing, a dependency down, the keeper out of gas,
# errors piling up); this workflow only reads its answer. The alert texts are admin-only on the
# route, so the monitor sends the admin token when the repository has one and reads the count
# otherwise.
on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

# The job reads a URL and writes nothing back: no token scopes at all.
permissions: {}

# Two half-hour ticks cannot overlap, and a late one is not worth queuing.
concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.MONITOR_ENABLED != 'false' }}
    steps:
      - name: Ask the deployment
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://basestocks.finance' }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -n "$ADMIN_API_TOKEN" ]; then auth=(-H "x-admin-token: $ADMIN_API_TOKEN"); else auth=(); fi
          curl -fsS --max-time 90 "${auth[@]}" "$APP_URL/api/health" -o health.json || { echo "health endpoint unreachable"; exit 1; }
          node -e "
            const h = require('./health.json');
            console.log('deploy', h.deploy && h.deploy.commit, '| storage', JSON.stringify(h.storage), '| alerts', JSON.stringify(h.alerts));
            const problems = [];
            if (!h.ok) problems.push('health says not ok');
            if (h.storage && h.storage.tablesReady === false) problems.push('storage tables missing' + (h.storage.missing ? ': ' + h.storage.missing.join(', ') : ''));
            for (const a of h.alerts || []) problems.push(a);
            if (problems.length) { console.error('ALERT\n- ' + problems.join('\n- ')); process.exit(1); }
            console.log('all clear');
          "
