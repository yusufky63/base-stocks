name: Keeper

# The AutoInvest keeper tick. Vercel's Hobby cron runs at most once a day, so this schedule is
# what actually makes plans run on time. Overlaps with the Vercel cron are harmless: a plan is
# locked while it executes and the contract refuses a second run inside the cadence.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEPER_ENABLED != 'false' }}
    steps:
      - name: Run due plans
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://basestocks.finance' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          curl -fsS -X POST "$APP_URL/api/cron/automation" -H "Authorization: Bearer $CRON_SECRET" | tee tick.json
          node -e "const r=require('./tick.json'); if(!r.enabled) console.log('keeper disabled: '+r.reason); else console.log('checked '+r.checked+', executed '+r.executed.length+', failed '+r.failed.length+', keeper ETH '+r.keeperEth);"
